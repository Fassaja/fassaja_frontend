<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2477FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fassaja" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Fassaja - Gerenciador de Tarefas</title>
    <!--
      Anti-flash: aplica o tema ANTES do primeiro paint. Sem isto o app pinta
      claro, o React monta e só então troca para escuro — um flash branco na
      cara de quem usa tema escuro, justamente no ambiente em que ele incomoda
      mais. Script síncrono e inline de propósito: precisa rodar antes do CSS
      pintar, então não pode ser um módulo (defer). A regra é a mesma do
      ThemeContext; mudar uma exige mudar a outra.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('fassaja_theme');
          var dark =
            pref === 'dark' ||
            ((pref === 'system' || !pref) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
